<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEX-AGENT AI | Terminal Legal Assistant</title>
    <!-- Google Fonts for Terminal Look -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0d14;
            --panel-bg: #111622;
            --border-color: #00ff66;
            --text-color: #00ff66;
            --text-dim: #00a843;
            --accent-color: #00ffff;
            --alert-color: #ff3366;
            --font-main: 'Fira Code', monospace;
            --font-title: 'VT323', monospace;
            --glow: 0 0 10px rgba(0, 255, 102, 0.4);
            --glow-cyan: 0 0 10px rgba(0, 255, 255, 0.4);
        }

        [data-theme="light"] {
            --bg-color: #f0f4f8;
            --panel-bg: #ffffff;
            --border-color: #0055ff;
            --text-color: #0a192f;
            --text-dim: #4a5568;
            --accent-color: #7928ca;
            --alert-color: #e53e3e;
            --glow: 0 0 10px rgba(0, 85, 255, 0.2);
            --glow-cyan: 0 0 10px rgba(121, 40, 202, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Top Bar */
        header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--glow);
            z-index: 10;
        }

        .title {
            font-family: var(--font-title);
            font-size: 2rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-size: 0.8rem;
            padding: 2px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: var(--font-main);
        }

        /* Main Container */
        main {
            flex: 1;
            position: relative;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Views / Interfaces */
        .view {
            display: none;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .view.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Interface 1: Hub Menu */
        #hub-view {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        .menu-title {
            font-family: var(--font-title);
            font-size: 3rem;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: var(--glow);
        }

        .hub-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 80%;
            max-width: 800px;
        }

        .hub-btn {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 30px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: all 0.2s ease;
            box-shadow: var(--glow);
        }

        .hub-btn:hover {
            background: var(--border-color);
            color: var(--bg-color);
            transform: translateY(-5px);
            box-shadow: 0 0 20px var(--border-color);
        }

        .hub-btn svg {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }

        /* Navigation Header for Sub-Interfaces */
        .sub-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            flex-shrink: 0;
        }

        .btn-exit {
            background: transparent;
            border: 1px solid var(--alert-color);
            color: var(--alert-color);
            padding: 6px 16px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.2s;
        }

        .btn-exit:hover {
            background: var(--alert-color);
            color: #fff;
        }

        /* Interface 2: AI Chat View */
        #chat-view {
            flex-direction: column;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            flex: 1;
            gap: 20px;
            height: calc(100% - 50px);
            overflow: hidden;
        }

        /* Claude-style Mini Interactive Bot Panel Styles */
        .mascot-panel {
            width: 280px;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            box-shadow: var(--glow);
            flex-shrink: 0;
        }

        .mascot-avatar {
            width: 140px;
            height: 140px;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .mascot-name {
            font-family: var(--font-title);
            font-size: 2.2rem;
            margin-top: 10px;
            letter-spacing: 2px;
            text-align: center;
        }

        .mascot-status {
            font-size: 0.85rem;
            color: var(--accent-color);
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--accent-color);
            padding: 6px 12px;
            border-radius: 4px;
            margin-top: 10px;
            text-align: center;
            width: 100%;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            box-shadow: var(--glow);
            overflow: hidden; /* CRUCIAL FIX FOR SCROLLING */
            min-width: 0;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto !important; /* Forces scrollbar */
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            scroll-behavior: smooth;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 6px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .chat-message.user {
            align-self: flex-end;
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .chat-message.ai {
            align-self: flex-start;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--text-color);
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
        }

        .chat-input:focus {
            box-shadow: var(--glow);
        }

        .btn-send {
            background: var(--border-color);
            color: var(--bg-color);
            border: none;
            padding: 0 25px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }

        .btn-send:hover {
            box-shadow: 0 0 15px var(--border-color);
        }

        /* Interface 3: Settings View */
        #settings-view {
            flex-direction: column;
        }

        .settings-container {
            flex: 1;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            box-shadow: var(--glow);
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-label {
            font-weight: bold;
            color: var(--accent-color);
        }

        .setting-input, textarea, select {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .toggle-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            width: fit-content;
            font-weight: bold;
        }

        /* Interface 4: Law Book View */
        #lawbook-view {
            flex-direction: column;
        }

        .law-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--glow);
            overflow: hidden;
        }

        .law-controls {
            display: flex;
            gap: 15px;
        }

        .search-input {
            flex: 1;
        }

        .law-results {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 4px;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .law-card {
            border: 1px solid var(--text-dim);
            padding: 15px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.02);
        }

        .law-card-title {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .law-card-meta {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="title">
            <span>[LEX-AGENT AI]</span>
            <span class="badge" id="mode-badge">OFFLINE: IND LAW</span>
        </div>
        <div>
            <span id="sys-clock">00:00:00</span>
        </div>
    </header>

    <main>
        <!-- INTERFACE 1: HUB MENU -->
        <div id="hub-view" class="view active">
            <h1 class="menu-title">SELECT SYSTEM MODULE</h1>
            <div class="hub-grid">
                <button class="hub-btn" onclick="navigateTo('chat-view')">
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                    [1] AI CHAT
                </button>
                <button class="hub-btn" onclick="navigateTo('settings-view')">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c-.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    [2] SETTINGS
                </button>
                <button class="hub-btn" onclick="navigateTo('lawbook-view')">
                    <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
                    [3] LAW BOOK
                </button>
            </div>
        </div>

        <!-- INTERFACE 2: AI CHAT -->
        <div id="chat-view" class="view">
            <div class="sub-nav">
                <h2>AI LEGAL COUNSEL CHAT</h2>
                <button class="btn-exit" onclick="navigateTo('hub-view')">[EXIT CHAT]</button>
            </div>
            <div class="chat-container">
                <!-- Claude-style Mini Interactive Mascot Panel -->
                <div class="mascot-panel">
                    <div class="mascot-avatar" id="mascot-avatar">
                        <!-- Default Ready State SVG -->
                        <svg viewBox="0 0 100 100" width="100%" height="100%">
                            <rect x="20" y="20" width="60" height="50" rx="8" fill="none" stroke="var(--border-color)" stroke-width="4"/>
                            <circle cx="38" cy="40" r="5" fill="var(--text-color)"/>
                            <circle cx="62" cy="40" r="5" fill="var(--text-color)"/>
                            <path d="M 40 55 Q 50 62 60 55" fill="none" stroke="var(--border-color)" stroke-width="3" stroke-linecap="round"/>
                            <line x1="50" y1="20
